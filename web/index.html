<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline ACM · Juarez Beltrán</title>
<meta name="robots" content="noindex">

<!--
  Página de acceso a Pipeline ACM.
  Redirige automáticamente a la aplicación (Google Apps Script).

  Si algún día cambiás la app y te dan una URL nueva /exec,
  reemplazá el valor de APP_URL de abajo por la nueva.
-->
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/juarezbeltran.com.ar/s/AKfycbyXblPtFd6MWy3wMJHG7udP7737ZO2xhkMkAH3K1ZfSvswc-67LGBk5vNHUbSv7bAUt/exec">

<style>
  :root{ --navy:#10295a; --navy2:#17386f; --green:#1f9d61; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .box{max-width:420px}
  .logo{
    font-size:22px; font-weight:850; letter-spacing:.2px; margin-bottom:6px;
  }
  .sub{opacity:.8; font-size:14px; margin-bottom:26px}
  .spinner{
    width:44px; height:44px; margin:0 auto 22px; border-radius:50%;
    border:4px solid rgba(255,255,255,.22); border-top-color:var(--green);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation:none} }
  .hint{font-size:13px; opacity:.85}
  a.manual{
    display:inline-block; margin-top:4px; color:#fff; font-weight:750;
    text-decoration:underline; text-underline-offset:3px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" role="status" aria-label="Cargando"></div>
    <div class="logo">Pipeline de Captación · ACM</div>
    <div class="sub">Juarez Beltrán · Asesores Inmobiliarios</div>
    <p class="hint">
      Redirigiendo a la aplicación…<br>
      Si no ocurre en unos segundos,
      <a class="manual" id="go" href="https://script.google.com/a/macros/juarezbeltran.com.ar/s/AKfycbyXblPtFd6MWy3wMJHG7udP7737ZO2xhkMkAH3K1ZfSvswc-67LGBk5vNHUbSv7bAUt/exec">entrá desde acá</a>.
    </p>
  </div>

  <script>
    var APP_URL = "https://script.google.com/a/macros/juarezbeltran.com.ar/s/AKfycbyXblPtFd6MWy3wMJHG7udP7737ZO2xhkMkAH3K1ZfSvswc-67LGBk5vNHUbSv7bAUt/exec";
    // replace() evita que "Atrás" vuelva a esta pantalla en un loop.
    window.location.replace(APP_URL);
  </script>
</body>
</html>
