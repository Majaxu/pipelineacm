<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/juarezbeltran.com.ar/s/AKfycbyXblPtFd6MWy3wMJHG7udP7737ZO2xhkMkAH3K1ZfSvswc-67LGBk5vNHUbSv7bAUt/exec">

<style>
  :root{ --navy:#123a72; --navy2:#0e2b57; --green:#1f9d61; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .box{max-width:440px}
  .logo{width:min(320px,78vw); height:auto; margin:0 auto 26px; display:block}
  .spinner{
    width:40px; height:40px; margin:0 auto 20px; border-radius:50%;
    border:4px solid rgba(255,255,255,.22); border-top-color:var(--green);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation:none} }
  .title{font-size:15px; font-weight:800; letter-spacing:.3px; opacity:.95; margin-bottom:20px}
  .hint{font-size:13px; opacity:.82}
  a.manual{display:inline-block; margin-top:4px; color:#fff; font-weight:750; text-decoration:underline; text-underline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="logo-jb-blanco.png" alt="Juarez Beltrán · Asesores Inmobiliarios">
    <div class="title">Pipeline de Captación · ACM</div>
    <div class="spinner" role="status" aria-label="Cargando"></div>
    <p class="hint">
