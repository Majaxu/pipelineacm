<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline ACM · Juarez Beltrán</title>
<style>
  :root{
    --navy:#10295a;
    --navy-2:#17386f;
    --ink:#142033;
    --muted:#6d7888;
    --line:#dce3ed;
    --panel:#ffffff;
    --bg:#f4f7fb;
    --ok:#1f9d61;
    --danger:#cc3d4a;
    --warning:#d98f1b;
    --soft:#edf2f7;
    --shadow:0 12px 30px rgba(16,41,90,.10);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--ink);
    background:var(--bg);
  }
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  a{color:inherit}

  .app{max-width:1550px;margin:0 auto;padding:22px}
  .topbar{
    display:flex;gap:18px;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:white;padding:22px 24px;border-radius:22px;box-shadow:var(--shadow);
    position:sticky;top:12px;z-index:10;
  }
  .brand h1{font-size:24px;margin:0 0 4px;font-weight:850;letter-spacing:.1px}
  .brand p{margin:0;opacity:.82;font-size:14px}
  .actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .btn{
    border:0;border-radius:12px;padding:10px 14px;font-weight:750;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn.primary{background:white;color:var(--navy)}
  .btn.secondary{background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.2)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.danger{background:#fff0f1;color:#9e2732;border:1px solid #f2c8cd}
  .btn.small{padding:7px 10px;font-size:12px;border-radius:9px}

  .stats{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0;
  }
  .stat{
    background:white;border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    box-shadow:0 5px 20px rgba(16,41,90,.05)
  }
  .stat .n{font-size:28px;font-weight:900;line-height:1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:700;text-transform:uppercase;letter-spacing:.55px}

  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;
  }
  .toolbar input,.toolbar select{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);
  }
  .toolbar input{min-width:280px;flex:1}
  .toolbar .count{font-size:13px;color:var(--muted);font-weight:650;margin-left:auto}

  .list{display:flex;flex-direction:column;gap:12px}
  .property{
    --p:0;
    border-radius:18px;
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow:0 7px 24px rgba(16,41,90,.06);
    background:
      linear-gradient(90deg,
        rgba(235,239,244,1) 0%,
        rgba(235,239,244,1) calc((100 - var(--p))*1%),
        rgba(31,157,97,.10) calc((100 - var(--p))*1%),
        rgba(31,157,97,.19) 100%);
    transition:background .25s ease,border-color .25s ease,transform .2s ease;
  }
  .property:hover{transform:translateY(-1px)}
  .property[data-status="cancelado"]{
    background:#fff1f2;border-color:#f2c3c8;
  }
  .property[data-status="completo"]{
    background:linear-gradient(90deg,#dff4e9,#cbeddb);
    border-color:#aedbc4;
  }

  .row{
    display:grid;
    grid-template-columns:minmax(260px,1.3fr) minmax(550px,3fr) 170px 44px;
    gap:14px;align-items:center;padding:14px 16px;
  }
  .identity{min-width:0}
  .address{font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owner{color:var(--muted);font-size:13px;margin-top:3px}
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .pill{
    display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;
    font-size:11px;font-weight:800;background:#fff;border:1px solid rgba(16,41,90,.10)
  }
  .pill.cancel{color:#a72e39;background:#fff3f4;border-color:#f1c5ca}
  .pill.done{color:#157548;background:#effaf4;border-color:#cbead9}

  .milestones{
    display:grid;grid-template-columns:repeat(8,minmax(58px,1fr));gap:7px;
  }
  .milestone{
    position:relative;border:1px solid rgba(16,41,90,.12);background:rgba(255,255,255,.78);
    border-radius:11px;padding:8px 7px 7px;min-height:54px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    transition:.18s ease;
  }
  .milestone:hover{background:#fff;border-color:#b9c7da}
  .milestone.done{background:#e9f8f0;border-color:#a9dcc4;color:#116a42}
  .milestone.disabled{opacity:.42;cursor:not-allowed}
  .milestone input{position:absolute;opacity:0;pointer-events:none}
  .tick{
    width:17px;height:17px;border-radius:5px;border:2px solid currentColor;
    display:grid;place-items:center;font-size:11px;line-height:1;color:#7a8798;
  }
  .done .tick{color:#16784b;background:#16784b;border-color:#16784b}
  .done .tick::after{content:"✓";color:#fff;font-weight:900}
  .milestone span:last-child{font-size:10px;font-weight:850;line-height:1.05}

  .progressBox{min-width:0}
  .progressTop{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:850;margin-bottom:7px}
  .progressTop .pct{font-size:14px;color:var(--navy)}
  .bar{height:9px;background:rgba(255,255,255,.72);border-radius:999px;border:1px solid rgba(16,41,90,.08);overflow:hidden}
  .bar > div{height:100%;width:0;background:linear-gradient(90deg,#84c9a7,#238c5b);transition:width .25s ease}
  .chev{
    width:38px;height:38px;border:1px solid rgba(16,41,90,.12);background:rgba(255,255,255,.9);
    border-radius:10px;color:var(--navy);font-weight:900;font-size:18px;
  }
  .property.open .chev{transform:rotate(180deg)}

  .details{
    display:none;background:rgba(255,255,255,.93);border-top:1px solid var(--line);
    padding:16px;
  }
  .property.open .details{display:block}
  .detailsGrid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;
  }
  .stage{
    background:white;border:1px solid var(--line);border-radius:15px;padding:14px;
  }
  .stage h3{margin:0 0 12px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.45px}
  .field{margin:0 0 10px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:11px;font-weight:800;color:#556172;margin:0 0 5px}
  .field input[type="text"], .field input[type="url"], .field textarea, .field select{
    width:100%;border:1px solid #d9e0e9;border-radius:10px;padding:9px 10px;background:#fbfcfe;color:var(--ink);
    outline:none;
  }
  .field textarea{min-height:78px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#8da6c9;box-shadow:0 0 0 3px rgba(23,56,111,.08)}
  .checkline{
    display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed #e6ebf1;font-size:12px;font-weight:700;
  }
  .checkline:last-child{border-bottom:0}
  .checkline input{margin-top:2px;accent-color:var(--ok)}
  .docrow{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}
  .linkBtn{white-space:nowrap}
  .hint{font-size:10px;color:var(--muted);margin-top:4px}
  .footerActions{
    display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)
  }
  .created{font-size:11px;color:var(--muted)}
  .rightBtns{display:flex;gap:8px;flex-wrap:wrap}

  .empty{
    text-align:center;padding:56px 20px;background:white;border:1px dashed #bdc8d7;border-radius:18px;color:var(--muted)
  }
  .empty strong{display:block;color:var(--navy);font-size:18px;margin-bottom:6px}

  dialog{
    width:min(660px,calc(100vw - 30px));border:0;border-radius:20px;padding:0;box-shadow:0 25px 70px rgba(0,0,0,.25)
  }
  dialog::backdrop{background:rgba(8,18,35,.52)}
  .modalHead{padding:18px 20px;background:var(--navy);color:white}
  .modalHead h2{margin:0;font-size:18px}
  .modalBody{padding:18px 20px;background:white}
  .modalGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modalFoot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px;background:white}
  .full{grid-column:1/-1}

  .toast{
    position:fixed;right:22px;bottom:22px;background:#11264d;color:white;padding:12px 14px;border-radius:12px;
    box-shadow:var(--shadow);font-size:12px;font-weight:750;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:100
  }
  .toast.show{opacity:1;transform:translateY(0)}

  @media (max-width:1150px){
    .row{grid-template-columns:1fr 1.9fr 150px 40px}
    .milestones{grid-template-columns:repeat(4,1fr)}
    .detailsGrid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:780px){
    .app{padding:10px}
    .topbar{position:static;align-items:flex-start;flex-direction:column;border-radius:16px}
    .stats{grid-template-columns:1fr 1fr}
    .row{grid-template-columns:1fr 42px}
    .milestones,.progressBox{grid-column:1/-1}
    .milestones{grid-template-columns:repeat(4,1fr)}
    .detailsGrid{grid-template-columns:1fr}
    .modalGrid{grid-template-columns:1fr}
    .toolbar input{min-width:100%}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Pipeline de Captación · ACM</h1>
      <p>Seguimiento de leads, hitos, documentación e informes de comercialización.</p>
    </div>
    <div class="actions">
      <button class="btn secondary" id="exportBtn">Exportar respaldo</button>
      <label class="btn secondary" for="importFile" style="cursor:pointer">Importar respaldo</label>
      <input id="importFile" type="file" accept=".json" hidden>
      <button class="btn primary" id="newBtn">＋ Nueva propiedad</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Propiedades</div></div>
    <div class="stat"><div class="n" id="stActive">0</div><div class="l">Leads activos</div></div>
    <div class="stat"><div class="n" id="stDone">0</div><div class="l">Completados</div></div>
    <div class="stat"><div class="n" id="stAvg">0%</div><div class="l">Avance promedio</div></div>
  </section>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Buscar por dirección, propietario, cuenta de Rentas...">
    <select id="filter">
      <option value="todos">Todos</option>
      <option value="activos">Activos</option>
      <option value="completos">Completos</option>
      <option value="cancelados">Cancelados / no aptos</option>
    </select>
    <select id="sort">
      <option value="recent">Más recientes</option>
      <option value="progressDesc">Mayor avance</option>
      <option value="progressAsc">Menor avance</option>
      <option value="address">Dirección A–Z</option>
    </select>
    <div class="count" id="countText"></div>
  </section>

  <main id="list" class="list"></main>
</div>

<dialog id="newDialog">
  <div class="modalHead"><h2>Ingresar lead</h2></div>
  <form id="newForm">
    <div class="modalBody">
      <div class="modalGrid">
        <div class="field full">
          <label>Dirección del inmueble *</label>
          <input id="fAddress" type="text" required placeholder="Ej. Av. Colón 1234, Córdoba">
        </div>
        <div class="field">
          <label>Nombre del propietario *</label>
          <input id="fOwner" type="text" required placeholder="Nombre y apellido">
        </div>
        <div class="field">
          <label>Teléfono / contacto</label>
          <input id="fPhone" type="text" placeholder="Opcional">
        </div>
      </div>
    </div>
    <div class="modalFoot">
      <button type="button" class="btn ghost" id="cancelNew">Cancelar</button>
      <button type="submit" class="btn primary" style="background:var(--navy);color:white">Crear lead</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const STORE = "jb_acm_pipeline_v1";

  const STAGES = [
    {key:"pre", label:"Precalificación"},
    {key:"research", label:"Investigación"},
    {key:"visit", label:"Visita"},
    {key:"acm", label:"ACM"},
    {key:"docs", label:"Documentación"},
    {key:"media", label:"Audiovisual"},
    {key:"reports", label:"Informes"},
    {key:"market", label:"Precio mercado"}
  ];

  const blank = (address, owner, phone="") => ({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
    createdAt: new Date().toISOString(),
    address, owner, phone,
    cancelled:false,
    pre:{
      done:false, rentas:"",
      why:"", time:"", otherAgency:"", costs:"", notes:""
    },
    research:{
      done:false, identity:false, reportRequested:false, reportUrl:"",
      status:""
    },
    visit:{done:false},
    acm:{done:false, reportUrl:""},
    docs:{done:false, escritura:false, escrituraUrl:"", rest:false, restUrl:""},
    media:{done:false, mediaUrl:""},
    reports:{
      done:false,
      r1:false,r1Url:"",
      r2:false,r2Url:"",
      r3:false,r3Url:""
    },
    market:{done:false, notes:""},
    closing:{
      negotiation:false,reservation:false,deed:false
    }
  });

  let items = load();

  const $ = (s,root=document)=>root.querySelector(s);
  const $$ = (s,root=document)=>[...root.querySelectorAll(s)];

  function load(){
    try{
      const raw=localStorage.getItem(STORE);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(){
    localStorage.setItem(STORE,JSON.stringify(items));
    updateStats();
  }
  function byId(id){ return items.find(x=>x.id===id); }

  function effectiveDone(item, key){
    if(key==="pre") return !!(item.pre.done && item.pre.rentas.trim());
    if(key==="research") return !!(item.research.done && item.research.identity && item.research.reportRequested && item.research.status);
    if(key==="docs") return !!(item.docs.done && item.docs.escritura);
    if(key==="reports") return !!(item.reports.done && item.reports.r1 && item.reports.r2 && item.reports.r3);
    return !!item[key]?.done;
  }
  function progress(item){
    const done = STAGES.filter(s=>effectiveDone(item,s.key)).length;
    return Math.round(done / STAGES.length * 100);
  }
  function stageLocked(item,key){
    return item.cancelled && key!=="research";
  }

  function escapeHtml(s=""){
    return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
  }
  function validUrl(u){
    if(!u) return false;
    try{ const x=new URL(u); return ["http:","https:"].includes(x.protocol); }catch(e){return false;}
  }
  function openLink(u){
    if(validUrl(u)) window.open(u,"_blank","noopener");
    else toast("Cargá primero un link válido (http/https).");
  }
  function toast(msg){
    const t=$("#toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200);
  }

  function setPath(obj,path,val){
    const p=path.split(".");
    let cur=obj;
    for(let i=0;i<p.length-1;i++) cur=cur[p[i]];
    cur[p[p.length-1]]=val;
  }
  function getPath(obj,path){
    return path.split(".").reduce((a,k)=>a?.[k],obj);
  }

  function stageHtml(item,s){
    const done=effectiveDone(item,s.key);
    const disabled=stageLocked(item,s.key);
    return `
      <label class="milestone ${done?"done":""} ${disabled?"disabled":""}" title="${escapeHtml(s.label)}">
        <input type="checkbox" data-stage="${s.key}" ${done?"checked":""} ${disabled?"disabled":""}>
        <span class="tick"></span>
        <span>${escapeHtml(s.label)}</span>
      </label>`;
  }

  function linkField(label,path,value){
    return `
      <div class="field">
        <label>${label}</label>
        <div class="docrow">
          <input type="url" data-path="${path}" value="${escapeHtml(value||"")}" placeholder="https://...">
          <button type="button" class="btn ghost small linkBtn" data-open-path="${path}">Abrir</button>
        </div>
      </div>`;
  }

  function card(item){
    const p=progress(item);
    const complete=p===100 && !item.cancelled;
    const status=item.cancelled?"cancelado":complete?"completo":"activo";

    return `
    <article class="property" data-id="${item.id}" data-status="${status}" style="--p:${p}">
      <div class="row">
        <div class="identity">
          <div class="address">${escapeHtml(item.address)}</div>
          <div class="owner">${escapeHtml(item.owner)}${item.phone?` · ${escapeHtml(item.phone)}`:""}</div>
          <div class="meta">
            ${item.cancelled?`<span class="pill cancel">NO APTO · Lead cancelado</span>`:
              complete?`<span class="pill done">Proceso completo</span>`:
              `<span class="pill">Lead activo</span>`}
            ${item.pre.rentas?`<span class="pill">Rentas: ${escapeHtml(item.pre.rentas)}</span>`:""}
          </div>
        </div>

        <div class="milestones">
          ${STAGES.map(s=>stageHtml(item,s)).join("")}
        </div>

        <div class="progressBox">
          <div class="progressTop"><span>Avance</span><span class="pct">${p}%</span></div>
          <div class="bar"><div style="width:${p}%"></div></div>
        </div>

        <button type="button" class="chev" aria-label="Ver detalle">⌄</button>
      </div>

      <div class="details">
        <div class="detailsGrid">

          <section class="stage">
            <h3>1 · Llamada pre-calificación</h3>
            <div class="field">
              <label>Número de cuenta de Rentas *</label>
              <input type="text" data-path="pre.rentas" value="${escapeHtml(item.pre.rentas)}" placeholder="Obligatorio para confirmar el hito">
            </div>
            <div class="field"><label>¿Por qué necesita vender?</label><textarea data-path="pre.why">${escapeHtml(item.pre.why)}</textarea></div>
            <div class="field"><label>¿En cuánto tiempo necesita vender?</label><textarea data-path="pre.time">${escapeHtml(item.pre.time)}</textarea></div>
            <div class="field"><label>¿Ya lo tiene publicado otra inmobiliaria?</label><textarea data-path="pre.otherAgency">${escapeHtml(item.pre.otherAgency)}</textarea></div>
            <div class="field"><label>¿Conoce los gastos a la hora de vender?</label><textarea data-path="pre.costs">${escapeHtml(item.pre.costs)}</textarea></div>
            <div class="field"><label>Información extra / notas</label><textarea data-path="pre.notes">${escapeHtml(item.pre.notes)}</textarea></div>
            <label class="checkline"><input type="checkbox" data-path="pre.done" ${item.pre.done?"checked":""}> Confirmar llamada de pre-calificación</label>
            <div class="hint">El hito se considera cumplido cuando la llamada está confirmada y existe número de cuenta de Rentas.</div>
          </section>

          <section class="stage">
            <h3>2 · Investigación</h3>
            <label class="checkline"><input type="checkbox" data-path="research.identity" ${item.research.identity?"checked":""}> Identidad de la persona confirmada</label>
            <label class="checkline"><input type="checkbox" data-path="research.reportRequested" ${item.research.reportRequested?"checked":""}> Informe de matrícula pedido</label>
            ${linkField("Link al informe de matrícula","research.reportUrl",item.research.reportUrl)}
            <div class="field">
              <label>Resultado de informes *</label>
              <select data-path="research.status">
                <option value="" ${!item.research.status?"selected":""}>Seleccionar...</option>
                <option value="apto" ${item.research.status==="apto"?"selected":""}>Apto Venta</option>
                <option value="pendiente" ${item.research.status==="pendiente"?"selected":""}>Apto pendiente</option>
                <option value="no_apto" ${item.research.status==="no_apto"?"selected":""}>No apto</option>
              </select>
            </div>
            <label class="checkline"><input type="checkbox" data-path="research.done" ${item.research.done?"checked":""}> Investigación revisada / confirmada</label>
            <div class="hint">Si elegís “No apto”, el lead se cancela y los hitos posteriores quedan bloqueados.</div>
          </section>

          <section class="stage">
            <h3>3 · Visita al inmueble</h3>
            <label class="checkline"><input type="checkbox" data-path="visit.done" ${item.visit.done?"checked":""} ${item.cancelled?"disabled":""}> Visita confirmada / realizada</label>
            <div class="hint">Según el proceso: llegar con ficha de tasación, recorrido, fotos de mantenimiento y profundización del vínculo.</div>
          </section>

          <section class="stage">
            <h3>4 · Presentación de ACM</h3>
            <label class="checkline"><input type="checkbox" data-path="acm.done" ${item.acm.done?"checked":""} ${item.cancelled?"disabled":""}> ACM presentado / entregado</label>
            ${linkField("Link al ACM / estimación","acm.reportUrl",item.acm.reportUrl)}
            <div class="hint">Incluye preparar entregables tangibles y presentar el ACM.</div>
          </section>

          <section class="stage">
            <h3>5 · Documentación</h3>
            <label class="checkline"><input type="checkbox" data-path="docs.escritura" ${item.docs.escritura?"checked":""} ${item.cancelled?"disabled":""}> Escritura escaneada</label>
            ${linkField("Link a escritura escaneada","docs.escrituraUrl",item.docs.escrituraUrl)}
            <label class="checkline"><input type="checkbox" data-path="docs.rest" ${item.docs.rest?"checked":""} ${item.cancelled?"disabled":""}> Resto de documentación pedida / recibida</label>
            ${linkField("Link a carpeta de documentación","docs.restUrl",item.docs.restUrl)}
            <label class="checkline"><input type="checkbox" data-path="docs.done" ${item.docs.done?"checked":""} ${item.cancelled?"disabled":""}> Documentación validada</label>
          </section>

          <section class="stage">
            <h3>6 · Producción audiovisual PRO</h3>
            <label class="checkline"><input type="checkbox" data-path="media.done" ${item.media.done?"checked":""} ${item.cancelled?"disabled":""}> HECHO</label>
            ${linkField("Link a fotos / video / publicación","media.mediaUrl",item.media.mediaUrl)}
            <div class="hint">El proceso prevé abrir ventanas, prender luces, despejar superficies y publicar el mismo día con fotos crudas mientras se edita el material.</div>
          </section>

          <section class="stage">
            <h3>7 · Informes de comercialización</h3>
            <label class="checkline"><input type="checkbox" data-path="reports.r1" ${item.reports.r1?"checked":""} ${item.cancelled?"disabled":""}> Informe 1 entregado</label>
            ${linkField("Link Informe 1","reports.r1Url",item.reports.r1Url)}
            <label class="checkline"><input type="checkbox" data-path="reports.r2" ${item.reports.r2?"checked":""} ${item.cancelled?"disabled":""}> Informe 2 entregado</label>
            ${linkField("Link Informe 2","reports.r2Url",item.reports.r2Url)}
            <label class="checkline"><input type="checkbox" data-path="reports.r3" ${item.reports.r3?"checked":""} ${item.cancelled?"disabled":""}> Informe 3 entregado</label>
            ${linkField("Link Informe 3","reports.r3Url",item.reports.r3Url)}
            <label class="checkline"><input type="checkbox" data-path="reports.done" ${item.reports.done?"checked":""} ${item.cancelled?"disabled":""}> Ciclo de informes completado</label>
            <div class="hint">El PDF sugiere enviar informes cada 30 días con conclusión y plan de acción.</div>
          </section>

          <section class="stage">
            <h3>8 · Precio de mercado</h3>
            <label class="checkline"><input type="checkbox" data-path="market.done" ${item.market.done?"checked":""} ${item.cancelled?"disabled":""}> Llevado a precio de mercado</label>
            <div class="field"><label>Notas de ajuste / conversación con propietario</label><textarea data-path="market.notes">${escapeHtml(item.market.notes)}</textarea></div>
          </section>

          <section class="stage">
            <h3>Cierre posterior</h3>
            <label class="checkline"><input type="checkbox" data-path="closing.negotiation" ${item.closing.negotiation?"checked":""} ${item.cancelled?"disabled":""}> Negociación</label>
            <label class="checkline"><input type="checkbox" data-path="closing.reservation" ${item.closing.reservation?"checked":""} ${item.cancelled?"disabled":""}> Toma de reserva</label>
            <label class="checkline"><input type="checkbox" data-path="closing.deed" ${item.closing.deed?"checked":""} ${item.cancelled?"disabled":""}> Proceso de escritura</label>
            <div class="hint">Estos tres pasos quedan registrados aparte y no modifican el porcentaje de captación.</div>
          </section>

          <section class="stage">
            <h3>Datos del lead</h3>
            <div class="field"><label>Dirección</label><input type="text" data-path="address" value="${escapeHtml(item.address)}"></div>
            <div class="field"><label>Propietario</label><input type="text" data-path="owner" value="${escapeHtml(item.owner)}"></div>
            <div class="field"><label>Contacto</label><input type="text" data-path="phone" value="${escapeHtml(item.phone)}"></div>
          </section>
        </div>

        <div class="footerActions">
          <div class="created">Ingresado: ${new Date(item.createdAt).toLocaleString("es-AR")}</div>
          <div class="rightBtns">
            <button type="button" class="btn ghost small reopenBtn" ${!item.cancelled?"style='display:none'":""}>Reactivar lead</button>
            <button type="button" class="btn danger small deleteBtn">Eliminar propiedad</button>
          </div>
        </div>
      </div>
    </article>`;
  }

  function render(){
    const q=$("#search").value.trim().toLowerCase();
    const f=$("#filter").value;
    const s=$("#sort").value;

    let arr=items.filter(i=>{
      const hay=[i.address,i.owner,i.phone,i.pre.rentas].join(" ").toLowerCase().includes(q);
      const p=progress(i);
      const okf = f==="todos" ||
        (f==="activos" && !i.cancelled && p<100) ||
        (f==="completos" && !i.cancelled && p===100) ||
        (f==="cancelados" && i.cancelled);
      return hay && okf;
    });

    arr.sort((a,b)=>{
      if(s==="progressDesc") return progress(b)-progress(a);
      if(s==="progressAsc") return progress(a)-progress(b);
      if(s==="address") return a.address.localeCompare(b.address,"es");
      return new Date(b.createdAt)-new Date(a.createdAt);
    });

    $("#countText").textContent=`${arr.length} visible${arr.length===1?"":"s"}`;
    $("#list").innerHTML=arr.length ? arr.map(card).join("") :
      `<div class="empty"><strong>No hay propiedades para mostrar.</strong>Ingresá un nuevo lead o cambiá los filtros.</div>`;

    wireCards();
    updateStats();
  }

  function updateStats(){
    const total=items.length;
    const active=items.filter(i=>!i.cancelled && progress(i)<100).length;
    const done=items.filter(i=>!i.cancelled && progress(i)===100).length;
    const avg=total?Math.round(items.reduce((a,i)=>a+progress(i),0)/total):0;
    $("#stTotal").textContent=total;
    $("#stActive").textContent=active;
    $("#stDone").textContent=done;
    $("#stAvg").textContent=avg+"%";
  }

  function toggleStage(item,key,checked){
    if(item.cancelled && key!=="research") return;
    if(key==="pre"){
      if(checked && !item.pre.rentas.trim()){
        toast("Para confirmar Precalificación, cargá el número de cuenta de Rentas.");
        return false;
      }
      item.pre.done=checked;
    }else if(key==="research"){
      if(checked && !(item.research.identity && item.research.reportRequested && item.research.status)){
        toast("Completá identidad, pedido de informe y resultado antes de confirmar Investigación.");
        return false;
      }
      item.research.done=checked;
    }else if(key==="docs"){
      if(checked && !item.docs.escritura){
        toast("Para confirmar Documentación, primero marcá Escritura escaneada.");
        return false;
      }
      item.docs.done=checked;
    }else if(key==="reports"){
      if(checked && !(item.reports.r1 && item.reports.r2 && item.reports.r3)){
        toast("Para cerrar Informes, marcá los informes 1, 2 y 3 como entregados.");
        return false;
      }
      item.reports.done=checked;
    }else{
      item[key].done=checked;
    }
    save(); return true;
  }

  function wireCards(){
    $$(".property").forEach(el=>{
      const id=el.dataset.id;
      const item=byId(id);

      $(".chev",el).addEventListener("click",()=>el.classList.toggle("open"));

      $$("[data-stage]",el).forEach(ch=>{
        ch.addEventListener("change",()=>{
          const ok=toggleStage(item,ch.dataset.stage,ch.checked);
          if(!ok) ch.checked=!ch.checked;
          renderKeepOpen(id);
        });
      });

      $$("[data-path]",el).forEach(inp=>{
        const ev = inp.matches("textarea,input[type='text'],input[type='url']") ? "input" : "change";
        inp.addEventListener(ev,()=>{
          let value=inp.type==="checkbox"?inp.checked:inp.value;
          setPath(item,inp.dataset.path,value);

          if(inp.dataset.path==="research.status"){
            item.cancelled = value==="no_apto";
            if(item.cancelled){
              item.research.done=true;
              toast("Lead marcado como NO APTO y cancelado.");
            }
          }
          save();

          if(ev==="change" || inp.type==="checkbox" || inp.dataset.path==="address" || inp.dataset.path==="owner"){
            renderKeepOpen(id);
          }else{
            refreshCardProgress(el,item);
          }
        });
      });

      $$("[data-open-path]",el).forEach(btn=>{
        btn.addEventListener("click",()=>openLink(getPath(item,btn.dataset.openPath)));
      });

      $(".deleteBtn",el).addEventListener("click",()=>{
        if(confirm(`¿Eliminar "${item.address}"? Esta acción no se puede deshacer.`)){
          items=items.filter(x=>x.id!==id); save(); render();
        }
      });

      const rb=$(".reopenBtn",el);
      if(rb) rb.addEventListener("click",()=>{
        item.cancelled=false;
        if(item.research.status==="no_apto") item.research.status="pendiente";
        save(); renderKeepOpen(id); toast("Lead reactivado.");
      });
    });
  }

  function refreshCardProgress(el,item){
    const p=progress(item);
    el.style.setProperty("--p",p);
    $(".pct",el).textContent=p+"%";
    $(".bar > div",el).style.width=p+"%";
    updateStats();
  }

  function renderKeepOpen(id){
    const wasOpen=$(`.property[data-id="${id}"]`)?.classList.contains("open");
    render();
    if(wasOpen) $(`.property[data-id="${id}"]`)?.classList.add("open");
  }

  $("#newBtn").addEventListener("click",()=>{
    $("#newForm").reset(); $("#newDialog").showModal(); setTimeout(()=>$("#fAddress").focus(),50);
  });
  $("#cancelNew").addEventListener("click",()=>$("#newDialog").close());
  $("#newForm").addEventListener("submit",e=>{
    e.preventDefault();
    const a=$("#fAddress").value.trim(), o=$("#fOwner").value.trim(), p=$("#fPhone").value.trim();
    if(!a||!o) return;
    items.unshift(blank(a,o,p)); save(); $("#newDialog").close(); render(); toast("Lead ingresado.");
  });

  $("#search").addEventListener("input",render);
  $("#filter").addEventListener("change",render);
  $("#sort").addEventListener("change",render);

  $("#exportBtn").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`pipeline-acm-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  });

  $("#importFile").addEventListener("change",async e=>{
    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const data=JSON.parse(await file.text());
      const incoming=Array.isArray(data)?data:data.items;
      if(!Array.isArray(incoming)) throw new Error("Formato inválido");
      if(confirm(`Esto reemplazará los ${items.length} leads actuales por ${incoming.length}. ¿Continuar?`)){
        items=incoming; save(); render(); toast("Respaldo importado.");
      }
    }catch(err){ alert("No pude importar el archivo: "+err.message); }
    e.target.value="";
  });

  render();
})();
</script>
</body>
</html>
